<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="HireKit builds an evidence-backed application kit from your CV and a job post." />
    <title>HireKit</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./anna-tool-ids.js"></script>
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <div id="app">
      <div class="hk-boot">
        <div class="hk-boot-inner">
          <p class="hk-eyebrow">HireKit</p>
          <h1>Your evidence, not a rewrite.</h1>
          <p class="hk-muted">Loading your workspace…</p>
          <div class="hk-boot-bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="hk-boot">
        <div class="hk-boot-inner">
          <h1>HireKit needs JavaScript</h1>
          <p class="hk-muted">Turn on JavaScript to build an evidence-backed application kit.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
